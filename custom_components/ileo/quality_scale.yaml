# Self-assessment against the Home Assistant Integration Quality Scale.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
#
# The scale is only awarded to integrations shipped with Home Assistant: for a
# custom integration this file is a checklist, not a badge. It uses the same
# format as core integrations so that it can be reviewed the same way.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no action.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: >
      No third-party dependency. The portal client lives in the integration
      (`api.py`, `parser.py`, `models.py`) and does not import Home Assistant;
      core would require it to be a separate published library.
  docs-actions:
    status: exempt
    comment: The integration registers no action.
  docs-triggers:
    status: exempt
    comment: The integration provides no trigger.
  docs-conditions:
    status: exempt
    comment: The integration provides no condition.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities are fed by the coordinator and subscribe to no event.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no action.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud service, nothing to discover on the network.
  discovery:
    status: exempt
    comment: Cloud service, nothing to discover on the network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry follows one contract, hence one meter, for its whole life.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Three entities that change at most once a day; none is noisy or niche.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: One config entry follows one contract, hence one meter, for its whole life.

  # Platinum
  async-dependency:
    status: done
    comment: The portal client is asynchronous (aiohttp); it is not a separate library.
  inject-websession: done
  strict-typing: done
