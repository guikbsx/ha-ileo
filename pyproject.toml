[project]
name = "ha-ileo"
version = "0.2.0"
description = "Intégration Home Assistant pour la consommation d'eau Iléo (Métropole Européenne de Lille)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/ileo"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "PTH"]
ignore = ["E501", "PLR2004", "PLR0913", "PLR0912", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true
